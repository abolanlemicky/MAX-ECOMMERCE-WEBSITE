<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>MAX | Register</title><meta name="description" content="Create a MAX account for faster checkout and order tracking." /><meta property="og:type" content="website" /><meta property="og:site_name" content="MAX" /><meta property="og:title" content="MAX | Register" /><meta property="og:description" content="Create a MAX account for faster checkout and order tracking." /><meta property="og:image" content="assets/products/Apple-AirPods-Pro-2.jfif" /><link rel="stylesheet" href="styles.css" /></head><body><div class="page-shell"><header class="site-header"><div class="utility-bar"><div class="utility-inner"><span>Free delivery on selected orders</span><div class="utility-links"><a href="contact.html">Customer service</a><a href="orders.html">Track order</a><a href="faq.html">Help</a></div></div></div><div class="header-main"><div class="header-main-inner"><a class="brand" href="index.html" aria-label="MAX home"><span class="brand-mark">M</span><span class="brand-copy"><span class="brand-word">MAX</span><span class="brand-tagline">Everything You Need. Delivered.</span></span></a><div class="header-actions"><a href="shop.html" class="header-action">Shop</a><a href="cart.html" class="header-action">Cart</a></div></div></div></header><main class="auth-shell"><div class="auth-card auth-card-wide"><span class="eyebrow">Create account</span><h1>Join MAX</h1><p class="subtle">Create a frontend demo account for faster checkout and order tracking.</p><form data-auth-form="register" novalidate><div class="form-group"><label for="registerName">Full name</label><input id="registerName" name="fullName" type="text" autocomplete="name" placeholder="Your full name" required /></div><div class="form-group"><label for="registerEmail">Email</label><input id="registerEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /></div><div
